<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CYBER.SLAYER - Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --g:#00ff9d;--p:#ff2d92;--c:#00e5ff;--y:#ffe600;--o:#ff8800;
  --d:#5a7a9a;--pu:#b347ff;--r:#ff3355
}
html,body{
  background:
    radial-gradient(ellipse at top left,rgba(0,229,255,0.15),transparent 50%),
    radial-gradient(ellipse at top right,rgba(255,45,146,0.12),transparent 50%),
    radial-gradient(ellipse at bottom,rgba(179,71,255,0.1),transparent 50%),
    linear-gradient(180deg,#050816 0%,#0a0a1a 50%,#0d0518 100%);
  color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden
}

/* Background effects */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    radial-gradient(2px 2px at 20% 30%,rgba(0,229,255,0.4),transparent),
    radial-gradient(2px 2px at 80% 70%,rgba(255,45,146,0.3),transparent),
    radial-gradient(1px 1px at 50% 50%,rgba(0,255,157,0.4),transparent),
    radial-gradient(2px 2px at 90% 20%,rgba(179,71,255,0.3),transparent);
  background-size:200% 200%;
  animation:starFloat 60s linear infinite;
  pointer-events:none;z-index:0;opacity:0.6
}
@keyframes starFloat{0%{background-position:0% 0%}100%{background-position:200% 200%}}

body::after{
  content:'';position:fixed;inset:0;
  background:
    repeating-linear-gradient(0deg,transparent 0px,transparent 4px,rgba(0,255,157,0.02) 4px,rgba(0,255,157,0.02) 5px),
    repeating-linear-gradient(90deg,transparent 0px,transparent 60px,rgba(0,229,255,0.025) 60px,rgba(0,229,255,0.025) 61px);
  pointer-events:none;z-index:1
}

.container{
  max-width:1400px;margin:0 auto;padding:20px;position:relative;z-index:10
}

/* Header */
.header{
  background:linear-gradient(180deg,rgba(15,20,40,0.85),rgba(10,15,30,0.6));
  backdrop-filter:blur(15px) saturate(180%);
  border:1px solid rgba(0,255,157,0.2);
  border-radius:20px;
  padding:20px 30px;
  margin-bottom:20px;
  display:flex;justify-content:space-between;align-items:center;
  position:relative;overflow:hidden
}
.header::before{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(0,255,157,0.6),rgba(0,229,255,0.8),rgba(255,45,146,0.6),transparent);
  animation:scanBeam 4s linear infinite
}
@keyframes scanBeam{0%{transform:translateX(-100%);opacity:0}10%,90%{opacity:1}100%{transform:translateX(100%);opacity:0}}

.logo{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:28px;
  background:linear-gradient(135deg,#00ff9d 0%,#00e5ff 25%,#ff2d92 50%,#b347ff 75%,#00ff9d 100%);
  background-size:300% 300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:logoShine 4s ease-in-out infinite;
  filter:drop-shadow(0 0 8px rgba(0,255,157,0.7));
  letter-spacing:4px
}
@keyframes logoShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.header-sub{
  font-family:'Share Tech Mono',monospace;font-size:11px;
  color:var(--p);letter-spacing:3px;margin-top:4px
}

.header-status{
  display:flex;align-items:center;gap:10px;
  font-family:'Orbitron',sans-serif;font-size:12px;
  color:var(--g);letter-spacing:2px
}
.live-dot{
  width:10px;height:10px;background:var(--g);border-radius:50%;
  box-shadow:0 0 12px var(--g);
  animation:livePulse 1.5s ease-in-out infinite
}
@keyframes livePulse{0%,100%{opacity:0.8}50%{opacity:1;transform:scale(1.2)}}

/* Stats Grid */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;margin-bottom:20px
}

.stat-card{
  background:linear-gradient(135deg,rgba(15,25,45,0.85),rgba(20,10,40,0.75));
  backdrop-filter:blur(10px);
  border:1px solid rgba(0,229,255,0.3);
  border-radius:16px;padding:20px;
  position:relative;overflow:hidden;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1)
}
.stat-card:hover{
  transform:translateY(-3px);
  border-color:rgba(0,229,255,0.6);
  box-shadow:0 8px 30px rgba(0,229,255,0.3)
}
.stat-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(45deg,transparent 30%,rgba(0,229,255,0.08) 50%,transparent 70%);
  background-size:200% 200%;
  animation:cardGlow 6s linear infinite;
  pointer-events:none
}
@keyframes cardGlow{0%{background-position:-100% -100%}100%{background-position:100% 100%}}

.stat-label{
  font-family:'Share Tech Mono',monospace;font-size:10px;
  color:var(--d);letter-spacing:3px;margin-bottom:8px
}
.stat-value{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:32px;
  background:linear-gradient(135deg,var(--g),var(--c));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:2px
}
.stat-card.purple .stat-value{background:linear-gradient(135deg,var(--p),var(--pu));-webkit-background-clip:text;background-clip:text}
.stat-card.yellow .stat-value{background:linear-gradient(135deg,var(--y),var(--o));-webkit-background-clip:text;background-clip:text}
.stat-card.red .stat-value{background:linear-gradient(135deg,var(--r),var(--p));-webkit-background-clip:text;background-clip:text}
.stat-icon{
  position:absolute;top:15px;right:15px;font-size:32px;opacity:0.3
}

/* Section */
.section{
  background:linear-gradient(135deg,rgba(15,20,40,0.85),rgba(25,15,40,0.75));
  backdrop-filter:blur(10px);
  border:1px solid rgba(0,255,157,0.25);
  border-radius:20px;padding:25px;margin-bottom:20px;
  position:relative
}
.section-title{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:18px;
  color:var(--g);letter-spacing:3px;margin-bottom:18px;
  display:flex;align-items:center;gap:10px;
  padding-bottom:10px;border-bottom:1px solid rgba(0,255,157,0.2)
}
.section-title::before{content:'◆';color:var(--p)}

/* Players Table */
.players-table{
  width:100%;border-collapse:collapse;
  font-family:'Share Tech Mono',monospace;font-size:12px
}
.players-table th{
  text-align:left;padding:12px 10px;
  background:rgba(0,255,157,0.05);
  color:var(--g);font-weight:700;letter-spacing:2px;
  border-bottom:2px solid rgba(0,255,157,0.3);
  font-size:11px
}
.players-table td{
  padding:10px;border-bottom:1px solid rgba(255,255,255,0.05);
  color:#c8e0f5
}
.players-table tr:hover td{
  background:rgba(0,255,157,0.05)
}
.rank-badge{
  display:inline-block;padding:3px 10px;border-radius:20px;
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:11px;
  background:linear-gradient(135deg,var(--c),var(--g));color:#000
}
.rank-badge.top1{background:linear-gradient(135deg,#ffe600,#ff8800);color:#000}
.rank-badge.top2{background:linear-gradient(135deg,#c8c8c8,#888);color:#000}
.rank-badge.top3{background:linear-gradient(135deg,#cd7f32,#8b4513);color:#fff}
.online-dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:6px
}
.online-dot.on{background:var(--g);box-shadow:0 0 8px var(--g)}
.online-dot.off{background:#555}

/* No data */
.no-data{
  text-align:center;padding:60px 20px;
  font-family:'Share Tech Mono',monospace;color:var(--d);font-size:14px;
  letter-spacing:2px
}
.no-data-icon{font-size:64px;margin-bottom:15px;opacity:0.5}

/* Bar Chart */
.chart-bars{
  display:flex;flex-direction:column;gap:8px
}
.chart-bar-row{
  display:flex;align-items:center;gap:10px
}
.chart-bar-label{
  font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;
  color:#c8e0f5;min-width:100px;letter-spacing:1px
}
.chart-bar-track{
  flex:1;height:24px;background:rgba(0,0,0,0.4);
  border-radius:6px;overflow:hidden;position:relative
}
.chart-bar-fill{
  height:100%;background:linear-gradient(90deg,var(--g),var(--c));
  border-radius:6px;
  display:flex;align-items:center;justify-content:flex-end;padding-right:10px;
  font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;color:#000;
  transition:width 0.5s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:0 0 10px rgba(0,255,157,0.4)
}

/* Two columns layout */
.two-col{
  display:grid;grid-template-columns:1fr 1fr;gap:20px
}
@media (max-width:800px){
  .two-col{grid-template-columns:1fr}
  .logo{font-size:20px;letter-spacing:2px}
  .stat-value{font-size:24px}
  .container{padding:10px}
}

/* Buttons */
.btn{
  background:linear-gradient(135deg,var(--g),var(--c));
  border:none;border-radius:10px;padding:8px 20px;
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:12px;
  color:#000;letter-spacing:2px;cursor:pointer;
  transition:all 0.3s;
  box-shadow:0 4px 15px rgba(0,255,157,0.4)
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,255,157,0.6)}
.btn.danger{background:linear-gradient(135deg,var(--p),var(--r))}

/* Refresh indicator */
.refresh-indicator{
  position:fixed;top:20px;right:20px;
  background:rgba(0,255,157,0.9);
  color:#000;padding:8px 16px;border-radius:20px;
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:11px;
  letter-spacing:2px;
  opacity:0;transition:opacity 0.3s;
  pointer-events:none;z-index:1000
}
.refresh-indicator.show{opacity:1}
</style>
</head>
<body>

<div class="container">
  
  <!-- Header -->
  <div class="header">
    <div>
      <div class="logo">⚔ CYBER.SLAYER</div>
      <div class="header-sub">// ADMIN DASHBOARD //</div>
    </div>
    <div class="header-status">
      <div class="live-dot"></div>
      <span id="connectionStatus">CONNECTING...</span>
    </div>
  </div>
  
  <!-- Quick Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon">👥</div>
      <div class="stat-label">TOTAL PLAYERS</div>
      <div class="stat-value" id="statTotal">0</div>
    </div>
    <div class="stat-card purple">
      <div class="stat-icon">🟢</div>
      <div class="stat-label">ONLINE NOW</div>
      <div class="stat-value" id="statOnline">0</div>
    </div>
    <div class="stat-card yellow">
      <div class="stat-icon">🏆</div>
      <div class="stat-label">HIGHEST STAGE</div>
      <div class="stat-value" id="statMaxStage">0</div>
    </div>
    <div class="stat-card red">
      <div class="stat-icon">💀</div>
      <div class="stat-label">TOTAL BOSSES</div>
      <div class="stat-value" id="statBosses">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">💰</div>
      <div class="stat-label">GOLD ECONOMY</div>
      <div class="stat-value" id="statGold">0</div>
    </div>
    <div class="stat-card purple">
      <div class="stat-icon">💎</div>
      <div class="stat-label">TOTAL GEMS</div>
      <div class="stat-value" id="statGems">0</div>
    </div>
  </div>
  
  <!-- Top Players -->
  <div class="section">
    <div class="section-title">🏆 TOP 50 PLAYERS</div>
    <div id="playersContainer">
      <div class="no-data">
        <div class="no-data-icon">📊</div>
        <div>WAITING FOR PLAYERS...</div>
      </div>
    </div>
  </div>
  
  <!-- Two Column: Devices + Languages -->
  <div class="two-col">
    <div class="section">
      <div class="section-title">📱 DEVICES</div>
      <div class="chart-bars" id="devicesChart"></div>
    </div>
    <div class="section">
      <div class="section-title">🌍 LANGUAGES</div>
      <div class="chart-bars" id="languagesChart"></div>
    </div>
  </div>
  
  <!-- Stage Distribution -->
  <div class="section">
    <div class="section-title">📈 STAGE DISTRIBUTION</div>
    <div class="chart-bars" id="stagesChart"></div>
  </div>
  
</div>

<div class="refresh-indicator" id="refreshIndicator">⟳ UPDATED</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBMpm_R2zihBqR1sZ1VgxdNe02vdXTeNjM",
  authDomain: "cyberslayer-6f553.firebaseapp.com",
  databaseURL: "https://cyberslayer-6f553-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cyberslayer-6f553",
  storageBucket: "cyberslayer-6f553.firebasestorage.app",
  messagingSenderId: "307703809193",
  appId: "1:307703809193:web:7709a926b3694347f895b8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Format numbers
function fmt(n){
  if(!n||isNaN(n))return'0';
  n=Math.floor(n);
  if(n<1000)return n.toString();
  if(n<1e6)return(n/1000).toFixed(1)+'K';
  if(n<1e9)return(n/1e6).toFixed(2)+'M';
  if(n<1e12)return(n/1e9).toFixed(2)+'B';
  return(n/1e12).toFixed(2)+'T';
}

// Connection status
db.ref('.info/connected').on('value', function(snap){
  const status = document.getElementById('connectionStatus');
  if(snap.val()){
    status.textContent = 'CONNECTED';
    status.style.color = '#00ff9d';
  } else {
    status.textContent = 'OFFLINE';
    status.style.color = '#ff3355';
  }
});

// Show refresh indicator
function showRefresh(){
  const r = document.getElementById('refreshIndicator');
  r.classList.add('show');
  setTimeout(()=>r.classList.remove('show'), 1500);
}

// Render dashboard
function renderDashboard(snapshot){
  const players = [];
  snapshot.forEach(child => players.push(child.val()));
  
  // Quick Stats
  document.getElementById('statTotal').textContent = players.length;
  document.getElementById('statOnline').textContent = players.filter(p => p.online).length;
  document.getElementById('statMaxStage').textContent = Math.max(0, ...players.map(p => p.stage || 0));
  document.getElementById('statBosses').textContent = fmt(players.reduce((s,p) => s + (p.bossKills||0), 0));
  document.getElementById('statGold').textContent = fmt(players.reduce((s,p) => s + (p.totalGoldEarned||0), 0));
  document.getElementById('statGems').textContent = fmt(players.reduce((s,p) => s + (p.gems||0), 0));
  
  // Top Players Table
  const container = document.getElementById('playersContainer');
  if(players.length === 0){
    container.innerHTML = '<div class="no-data"><div class="no-data-icon">📊</div><div>NO PLAYERS YET</div></div>';
    return;
  }
  
  // Sort by stage then totalGoldEarned
  const sorted = players.slice().sort((a,b) => {
    if((b.stage||0) !== (a.stage||0)) return (b.stage||0) - (a.stage||0);
    return (b.totalGoldEarned||0) - (a.totalGoldEarned||0);
  }).slice(0, 50);
  
  let html = `
    <table class="players-table">
      <thead>
        <tr>
          <th>RANK</th>
          <th>NAME</th>
          <th>STAGE</th>
          <th>BOSSES</th>
          <th>GOLD</th>
          <th>GEMS</th>
          <th>PRESTIGE</th>
          <th>DEVICE</th>
        </tr>
      </thead>
      <tbody>
  `;
  
  sorted.forEach((p, i) => {
    const rank = i + 1;
    let badgeClass = '';
    if(rank === 1) badgeClass = 'top1';
    else if(rank === 2) badgeClass = 'top2';
    else if(rank === 3) badgeClass = 'top3';
    
    html += `
      <tr>
        <td><span class="rank-badge ${badgeClass}">#${rank}</span></td>
        <td>
          <span class="online-dot ${p.online?'on':'off'}"></span>
          <strong>${(p.name||'Unknown').replace(/[<>]/g,'')}</strong>
        </td>
        <td style="color:#00e5ff;font-weight:700">${p.stage||1}</td>
        <td style="color:#ff2d92">${fmt(p.bossKills||0)}</td>
        <td style="color:#ffe600">${fmt(p.totalGoldEarned||0)}</td>
        <td style="color:#b347ff">${fmt(p.gems||0)}</td>
        <td>${(p.prestige||0) > 0 ? '⭐'.repeat(Math.min(5,p.prestige)) + (p.prestige>5?'+'+(p.prestige-5):'') : '-'}</td>
        <td style="font-size:11px;opacity:0.7">${p.device||'?'} • ${p.browser||'?'}</td>
      </tr>
    `;
  });
  
  html += '</tbody></table>';
  container.innerHTML = html;
  
  // Devices chart
  const devices = {};
  players.forEach(p => {
    const d = p.device || 'unknown';
    devices[d] = (devices[d] || 0) + 1;
  });
  renderBarChart('devicesChart', devices, players.length);
  
  // Languages chart
  const langs = {};
  players.forEach(p => {
    const l = (p.lang || 'unknown').toUpperCase();
    langs[l] = (langs[l] || 0) + 1;
  });
  renderBarChart('languagesChart', langs, players.length);
  
  // Stages chart
  const stages = {'1-10':0, '11-25':0, '26-50':0, '51-100':0, '101-200':0, '201+':0};
  players.forEach(p => {
    const s = p.stage || 1;
    if(s <= 10) stages['1-10']++;
    else if(s <= 25) stages['11-25']++;
    else if(s <= 50) stages['26-50']++;
    else if(s <= 100) stages['51-100']++;
    else if(s <= 200) stages['101-200']++;
    else stages['201+']++;
  });
  renderBarChart('stagesChart', stages, players.length);
}

function renderBarChart(containerId, data, total){
  const container = document.getElementById(containerId);
  if(!container) return;
  if(total === 0){
    container.innerHTML = '<div style="text-align:center;color:#5a7a9a;padding:20px">No data</div>';
    return;
  }
  
  let html = '';
  const entries = Object.entries(data).sort((a,b) => b[1] - a[1]);
  entries.forEach(([label, count]) => {
    const pct = total > 0 ? (count/total*100) : 0;
    html += `
      <div class="chart-bar-row">
        <div class="chart-bar-label">${label}</div>
        <div class="chart-bar-track">
          <div class="chart-bar-fill" style="width:${Math.max(8, pct)}%">${count}</div>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

// Listen to all players data
db.ref('players').on('value', function(snapshot){
  renderDashboard(snapshot);
  showRefresh();
});

console.log('🔥 Dashboard connected to Firebase');
</script>

</body>
</html>
